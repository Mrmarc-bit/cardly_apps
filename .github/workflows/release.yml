name: Cardly Auto Release & Supabase Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag rilis (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release Tag: $TAG (Version: $VERSION)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Configure Android Keystore for Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cardly-release.jks
            cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD || 'cardly2026' }}
          keyPassword=${{ secrets.KEY_PASSWORD || 'cardly2026' }}
          keyAlias=${{ secrets.KEY_ALIAS || 'cardly' }}
          storeFile=cardly-release.jks
          EOF
          else
            echo "No secrets.KEYSTORE_BASE64 provided. Generating release signing keystore..."
            mkdir -p /home/runner/.config/.android
            keytool -genkey -v -keystore /home/runner/.config/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android -keyalg RSA \
              -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Prepare Release APK Artifact
        id: prepare_apk
        run: |
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_DEST="cardly-release-${{ env.RELEASE_TAG }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          SIZE_BYTES=$(stat -c%s "$APK_DEST" 2>/dev/null || stat -f%z "$APK_DEST")
          echo "APK_SIZE_BYTES=$SIZE_BYTES" >> $GITHUB_ENV
          echo "APK Size: $SIZE_BYTES bytes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Cardly Release ${{ env.RELEASE_TAG }}"
          files: cardly-release-${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-generate version.json & Sync to Main
        run: |
          APK_DEST="cardly-release-${{ env.RELEASE_TAG }}.apk"
          SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/cardly-release-${{ env.RELEASE_TAG }}.apk"
          TODAY=$(date +%Y-%m-%d)

          BUILD_NUM=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\\+([0-9]+)/\1/')
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" = "pubspec.yaml" ]; then
            BUILD_NUM=${{ github.run_number }}
          fi

          cat <<EOF > version.json
          {
            "latest_version": "${{ env.RELEASE_VERSION }}",
            "build_number": $BUILD_NUM,
            "is_force_update": false,
            "download_url": "$DOWNLOAD_URL",
            "release_date": "$TODAY",
            "changelog": [
              "Pembaruan rilis resmi otomatis Cardly ${{ env.RELEASE_TAG }}",
              "Peningkatan kestabilan, performa, dan sinkronisasi data privat"
            ],
            "file_size_bytes": ${{ env.APK_SIZE_BYTES }},
            "variants": [
              {
                "arch": "universal",
                "label": "Universal (Semua HP)",
                "badge": "Kompatibilitas Penuh",
                "desc": "Memuat pustaka 64-bit dan 32-bit, dijamin dapat dipasang di seluruh perangkat Android",
                "file_name": "cardly-release-${{ env.RELEASE_TAG }}.apk",
                "download_url": "$DOWNLOAD_URL",
                "file_size_bytes": ${{ env.APK_SIZE_BYTES }},
                "sha256": "$SHA256"
              }
            ]
          }
          EOF
          cp version.json landing_page/version.json

          git add version.json landing_page/version.json
          git commit -m "chore(release): auto-sync version.json to ${{ env.RELEASE_TAG }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Auto-commit push failed, non-blocking"

      - name: Sync Metadata to Supabase Hub
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/cardly-release-${{ env.RELEASE_TAG }}.apk"
          TODAY=$(date +%Y-%m-%d)
          BUILD_NUM=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\\+([0-9]+)/\1/')
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" = "pubspec.yaml" ]; then
            BUILD_NUM=${{ github.run_number }}
          fi
          
          echo "Syncing version ${{ env.RELEASE_VERSION }} (build $BUILD_NUM) to Supabase app_versions..."
          
          AUTH_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_L8AGlfFIeB0E4rXvHt7tUg_V-1nrga1' }}"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://tsmdqyqftxriqgfurrae.supabase.co/rest/v1/app_versions" \
            -H "apikey: $AUTH_KEY" \
            -H "Authorization: Bearer $AUTH_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"latest_version\": \"${{ env.RELEASE_VERSION }}\",
              \"build_number\": $BUILD_NUM,
              \"download_url\": \"$DOWNLOAD_URL\",
              \"changelog\": [
                \"Pembaruan rilis resmi otomatis Cardly ${{ env.RELEASE_TAG }}\",
                \"Peningkatan kestabilan, performa, dan sinkronisasi data privat\"
              ],
              \"is_force_update\": false,
              \"release_date\": \"$TODAY\",
              \"file_size_bytes\": ${{ env.APK_SIZE_BYTES }}
            }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully synced to Supabase!"
          else
            echo "Warning: Supabase sync skipped or requires SUPABASE_SERVICE_ROLE_KEY in GitHub Secrets (HTTP $HTTP_CODE): $BODY"
            echo "Note: Web portal & in-app updater directly consume GitHub Releases API so the app & website are still 100% updated automatically!"
          fi

